 fill="#202438" font-weight="650">选择方便的方式</text><text x="24" y="524" font-size="13" fill="#626980" font-weight="400">二维码识别能力取决于网易云客户端</text><circle cx="30" cy="562" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="567" font-size="13" fill="#202438" font-weight="400">可在电脑展示二维码后扫码</text><circle cx="30" cy="597" r="3" fill="#087D91" stroke="none" stroke-width="1"/><text x="42" y="602" font-size="13" fill="#202438" font-weight="400">如 App 支持，可保存二维码识别</text><circle cx="30" cy="632" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="637" font-size="13" fill="#202438" font-weight="400">无法识别时，请使用另一台设备</text><rect x="24" y="680" width="342" height="50" rx="16" fill="#25263D" stroke="none"/><text x="45" y="711" font-size="16" fill="#FFFFFF" font-weight="600">返回登录二维码</text><text x="329" y="711" font-size="20" fill="#FFFFFF" font-weight="400">→</text><text x="24" y="752" font-size="11" fill="#626980" font-weight="400">示例稿不包含真实登录凭证</text><rect x="140" y="832" width="110" height="4" rx="2" fill="#202438" stroke="none"/></g></svg></svg>
FE3EF"/><text x="306" y="66" font-size="16" fill="#202438" font-weight="400">•••  ⊙</text><text x="24" y="105" font-size="11" fill="#626980" font-weight="600">授权 / 可恢复</text><text x="24" y="142" font-size="22" fill="#202438" font-weight="650">二维码已过期</text><text x="24" y="178" font-size="11" fill="#626980" font-weight="400">光与回声  /  设计示例</text><rect x="24" y="218" width="342" height="240" rx="24" fill="#FFFFFF" stroke="#DFE3EF"/><circle cx="195" cy="314" r="54" fill="none" stroke="#DFE3EF" stroke-width="2"/><path d="M166 340L217 283M175 277L226 351" fill="none" stroke="#6550B9" stroke-opacity=".4"/><text x="164" y="327" font-size="40" fill="#626980" font-weight="400">—</text><text x="85" y="420" font-size="13" fill="#626980" font-weight="400">状态已说明，可选择下一步操作</text><text x="24" y="496" font-size="25" fill="#202438" font-weight="650">重新生成即可继续</text><text x="24" y="524" font-size="13" fill="#626980" font-weight="400">之前的二维码已失效</text><circle cx="30" cy="562" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="567" font-size="13" fill="#202438" font-weight="400">不会创建重复绑定</text><circle cx="30" cy="597" r="3" fill="#087D91" stroke="none" stroke-width="1"/><text x="42" y="602" font-size="13" fill="#202438" font-weight="400">新二维码显示后重新扫码</text><circle cx="30" cy="632" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="637" font-size="13" fill="#202438" font-weight="400">网络不可用时保留重试入口</text><rect x="24" y="680" width="342" height="50" rx="16" fill="#25263D" stroke="none"/><text x="45" y="711" font-size="16" fill="#FFFFFF" font-weight="600">生成新二维码</text><text x="329" y="711" font-size="20" fill="#FFFFFF" font-weight="400">→</text><text x="24" y="752" font-size="11" fill="#626980" font-weight="400">返回开始页</text><rect x="140" y="832" width="110" height="4" rx="2" fill="#202438" stroke="none"/></g></svg><text x="886" y="1082" font-family="Microsoft YaHei,sans-serif" font-size="13" fill="#626980">S06 / 在同一部手机上连接</text><svg x="886" y="1095" xmlns="http
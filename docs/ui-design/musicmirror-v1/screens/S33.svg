2438" font-weight="400">42%</text><text x="58" y="419" font-size="11" fill="#626980" font-weight="400">08.22　　　 09.05　　　09.19</text><text x="49" y="248" font-size="12" fill="#626980" font-weight="400">电子 · 已知曲风内份额</text><text x="24" y="496" font-size="25" fill="#202438" font-weight="650">三个时点，开始连成线</text><text x="24" y="524" font-size="13" fill="#626980" font-weight="400">30 天　 /　 90 天　 /　 全部</text><circle cx="30" cy="562" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="567" font-size="13" fill="#202438" font-weight="400">08.22　→　09.05　→　09.19</text><circle cx="30" cy="597" r="3" fill="#087D91" stroke="none" stroke-width="1"/><text x="42" y="602" font-size="13" fill="#202438" font-weight="400">同版本、同规则的3次观察</text><circle cx="30" cy="632" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="637" font-size="13" fill="#202438" font-weight="400">沿着标签份额，查看变化方向</text><rect x="24" y="680" width="342" height="50" rx="16" fill="#25263D" stroke="none"/><text x="45" y="711" font-size="16" fill="#FFFFFF" font-weight="600">查看相邻报告</text><text x="329" y="711" font-size="20" fill="#FFFFFF" font-weight="400">→</text><text x="24" y="752" font-size="11" fill="#626980" font-weight="400">不足3次时显示积累进度，不画趋势线</text><path d="M24 788L366 788" stroke="#DFE3EF" stroke-width="1" fill="none"/><text x="45" y="813" font-size="12" fill="#626980" font-weight="400">镜像</text><text x="135" y="813" font-size="12" fill="#626980" font-weight="400">探索</text><text x="225" y="813" font-size="12" fill="#6550B9" font-weight="650">变化</text><text x="315" y="813" font-size="12" fill="#626980" font-weight="400">我的</text><rect x="140" y="832" width="110" height="4" rx="2" fill="#202438" stroke="none"/></g></svg>
50B9" stroke-width="3"/><text x="90" y="367" font-size="20" fill="#202438" font-weight="600">90</text><text x="176" y="367" font-size="20" fill="#202438" font-weight="600">129</text><text x="252" y="367" font-size="20" fill="#202438" font-weight="600">160</text><text x="61" y="417" font-size="11" fill="#626980" font-weight="400">加权25分位　/　中位数　/　75分位</text><text x="24" y="496" font-size="25" fill="#202438" font-weight="650">节拍只是一个线索</text><text x="24" y="524" font-size="13" fill="#626980" font-weight="400">已有 BPM，尚不能解释全部声音</text><circle cx="30" cy="562" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="567" font-size="13" fill="#202438" font-weight="400">BPM：90 / 129 / 160 分位数</text><circle cx="30" cy="597" r="3" fill="#087D91" stroke="none" stroke-width="1"/><text x="42" y="602" font-size="13" fill="#202438" font-weight="400">纯音乐标签 · 基于可靠元数据</text><circle cx="30" cy="632" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="637" font-size="13" fill="#202438" font-weight="400">旋律、人声质感与情绪暂不可判断</text><rect x="24" y="680" width="342" height="50" rx="16" fill="#25263D" stroke="none"/><text x="45" y="711" font-size="16" fill="#FFFFFF" font-weight="600">查看证据与来源</text><text x="329" y="711" font-size="20" fill="#FFFFFF" font-weight="400">→</text><text x="24" y="752" font-size="11" fill="#626980" font-weight="400">BPM不等于律动；推荐标签不代替音频测量</text><path d="M24 788L366 788" stroke="#DFE3EF" stroke-width="1" fill="none"/><text x="45" y="813" font-size="12" fill="#626980" font-weight="400">镜像</text><text x="135" y="813" font-size="12" fill="#6550B9" font-weight="650">探索</text><text x="225" y="813" font-size="12" fill="#626980" font-weight="400">变化</text><text x="315" y="813" font-size="12" fill="#626980" font-weight="400">我的</text><rect x="140" y="832" width="110" height="4" rx="2" fill="#202438" stroke="none"/></g></svg>
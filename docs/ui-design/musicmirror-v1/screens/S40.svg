<svg xmlns="http://www.w3.org/2000/svg" width="390" height="844" viewBox="0 0 390 844" role="img" aria-label="删除全部项目数据？"><defs><linearGradient id="bg40" x2="1" y2="1"><stop stop-color="#F9FAFE"/><stop offset="1" stop-color="#EFECFA"/></linearGradient><linearGradient id="pr40" x2="1" y2="1"><stop stop-color="#A48AE9" stop-opacity=".8"/><stop offset="1" stop-color="#77D8E5" stop-opacity=".4"/></linearGradient></defs><g font-family="Microsoft YaHei, PingFang SC, sans-serif"><rect x="0" y="0" width="390" height="844" rx="28" fill="url(#bg40)" stroke="none"/><text x="24" y="30" font-size="13" fill="#202438" font-weight="600">9:41</text><text x="308" y="30" font-size="12" fill="#202438" font-weight="400">▮▮  ▰</text><text x="24" y="68" font-size="29" fill="#202438" font-weight="400">‹</text><text x="55" y="65" font-size="14" fill="#626980" font-weight="600">MusicMirror</text><rect x="292" y="45" width="76" height="31" rx="16" fill="#FFFFFF" stroke="#DFE3EF"/><text x="306" y="66" font-size="16" fill="#202438" font-weight="400">•••  ⊙</text><text x="24" y="105" font-size="11" fill="#626980" font-weight="600">账户 / 删除确认</text><text x="24" y="142" font-size="22" fill="#202438" font-weight="650">删除全部项目数据？</text><text x="24" y="178" font-size="11" fill="#626980" font-weight="400">光与回声  /  设计示例</text><rect x="24" y="218" width="342" height="240" rx="24" fill="#FFFFFF" stroke="#DFE3EF"/><circle cx="195" cy="314" r="54" fill="none" stroke="#DFE3EF" stroke-width="2"/><path d="M166 340L217 283M175 277L226 351" fill="none" stroke="#6550B9" stroke-opacity=".4"/><text x="164" y="327" font-size="40" fill="#626980" font-weight="400">—</text><text x="85" y="420" font-size="13" fill="#626980" font-weight="400">状态已说明，可选择下一步操作</text><text x="24" y="496" font-size="25" fill="#202438" font-weight="650">这项操作无法撤回</text><text x="24" y="524" font-size="13" fill="#626980" font-weight="400">删除 MusicMirror 中的用户关联资料</text><circle cx="30" cy="562" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="567" font-size="13" fill="#202438" font-weight="400">删除报告、输入、任务与会话</text><circle cx="30" cy="597" r="3" fill="#087D91" stroke="none" stroke-width="1"/><text x="42" y="602" font-size="13" fill="#202438" font-weight="400">网易云原始音乐资料不受影响</text><circle cx="30" cy="632" r="3" fill="#6550B9" stroke="none" stroke-width="1"/><text x="42" y="637" font-size="13" fill="#202438" font-weight="400">已下载或分享的副本需自行删除</text><rect x="24" y="680" width="342" height="50" rx="16" fill="#AE354B" stroke="none"/><text x="45" y="711" font-size="16" fill="#FFFFFF" font-weight="600">确认删除全部数据</text><text x="329" y="711" font-size="20" fill="#FFFFFF" font-weight="400">→</text><text x="24" y="752" font-size="11" fill="#626980" font-weight="400">取消，保留数据</text><rect x="140" y="832" width="110" height="4" rx="2" fill="#202438" stroke="none"/></g></svg>